services:
  scorevault:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 8000:8000
    environment:
      REDIS: redis
      DB_HOST: db
      DB_USER: example
      DB_PASSWORD: example
      DB_NAME: example
    develop:
      watch:
        - action: sync
          path: .
          target: /app

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: example
      POSTGRES_DB: example

  redis:
    image: redis:8-alpine
